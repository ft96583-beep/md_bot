# ─── BOXXAXMD · Render one-click deploy ──────────
# Render → New → Blueprint → repo select karein, ye file khud sab set kar degi.
# Pairing ke baad WhatsApp session Upstash Redis mein save rehta hai
# (free tier ki disk ephemeral hai — file session kaam nahi karegi).
services:
  - type: web
    name: boxxax-md-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OWNER_NUMBER
        sync: false # Apna WhatsApp number (country code ke saath, bina + ke), masalan 923001234567
      - key: PORT
        sync: false # Aam tor par khaali chhorein — Render apna PORT khud inject karta hai
      - key: UPSTASH_REDIS_REST_URL
        sync: false # Upstash dashboard → Redis → REST URL (https://...upstash.io)
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false # Upstash dashboard → Redis → REST token
